<!DOCTYPE html>
<html>
<head>
    <title>MegaVisuals</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
            color: #ccc;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 25px auto;
        }

        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        .section h2 {
            margin-top: 0;
        }

        .photo {
            width: 100%;
            max-width: 500px;
            display: block;
            margin: 15px auto;
            border-radius: 10px;
        }

        .message {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>MegaVisuals</h1>
    <p>Videos • Audios • Pictures</p>
</header>

<div class="container">

    < class="section">
        <h2>📸 Pictures</h2>

        <img class="photo" src="Pictures/myphoto.jpg" alt="My Photo">

  <div class="section">
    <h2>🎬 Videos</h2>

    <video width="100%" controls>
        <source src="Videos/myvideo.mp4" type="video/mp4">
        Your browser does not support video playback.
    </video>

  </div>

  <div class="section">
    <h2>🎵 Audios</h2>

    <audio controls style="width: 100%;">
        <source src="Audios/myaudio.mp3" type="audio/mpeg">
        Your browser does not support audio playback.
    </audio>

    <br>

    <a href="Audios/myaudio.mp3" download
       style="display: block; text-align: center; background: #111; color: white; padding: 12px; border-radius: 8px; text-decoration: none;">
        ⬇️ Download Audio
    </a>

  </div>

</div>

<footer>
    <p>© 2026 MegaVisuals</p>
</footer>

</body>
</html>
